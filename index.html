
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumulierte Binomialverteilung</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f3f6fa;
            color: #222;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            font-size: 25px;
            color: #174ea6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #ergebnis {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            background: #eaf3ff;
            overflow-wrap: anywhere;
        }

        #wert {
            font-size: 25px;
            font-weight: bold;
            color: #174ea6;
        }

        .fehler {
            color: #b00020;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Kumulierte Binomialverteilung</h1>

    <p>
        Berechne die Wahrscheinlichkeit P(X ≤ k)
        für eine Binomialverteilung.
    </p>

    <label for="p">Trefferwahrscheinlichkeit p (0 bis 1):</label>
    <input type="text" id="p" value="0,3"
           inputmode="decimal" placeholder="z. B. 0,3">

    <label for="k">Anzahl der Treffer k:</label>
    <input type="number" id="k" value="3" min="0" step="1">

    <label for="n">Anzahl der Versuche n:</label>
    <input type="number" id="n" value="10" min="0" step="1">

    <button onclick="berechnen()">Wahrscheinlichkeit berechnen</button>

    <div id="ergebnis" aria-live="polite">
        <div id="wert">Noch keine Berechnung</div>
        <div id="prozent"></div>
        <p id="meldung"></p>
    </div>
</div>

<script>
function berechnen() {
    // Eingaben lesen; deutsches Dezimalkomma ist erlaubt
    const pText = document.getElementById("p").value.trim();
    const p = Number(pText.replace(",", "."));
    const k = Number(document.getElementById("k").value);
    const n = Number(document.getElementById("n").value);

    const wert = document.getElementById("wert");
    const prozent = document.getElementById("prozent");
    const meldung = document.getElementById("meldung");

    // Eingaben überprüfen
    if (pText === "" || !Number.isFinite(p) || p < 0 || p > 1) {
        fehler("p muss zwischen 0 und 1 liegen.");
        return;
    }

    if (!Number.isInteger(k) || !Number.isInteger(n) ||
        k < 0 || n < 0 || k > n || n > 10000) {
        fehler("Bitte ganze Zahlen eingeben: 0 ≤ k ≤ n ≤ 10000.");
        return;
    }

    // Startwert: P(X = 0) = (1-p)^n
    let term = Math.pow(1 - p, n);
    let summe = term;

    // Wahrscheinlichkeiten P(X = 1) bis P(X = k)
    // rekursiv berechnen, ohne große Fakultäten
    for (let i = 0; i < k; i++) {
        if (p === 0 || p === 1) {
            term = 0;
        } else {
            term = term * ((n - i) / (i + 1)) * (p / (1 - p));
        }
        summe += term;
    }

    // Randfälle exakt behandeln
    if (p === 0) summe = 1;
    if (p === 1) summe = (k === n) ? 1 : 0;

    // Rundungsfehler begrenzen
    summe = Math.max(0, Math.min(1, summe));

    wert.textContent = "P(X ≤ " + k + ") = " +
        summe.toLocaleString("de-DE", {
            maximumFractionDigits: 10
        });

    prozent.textContent = "In Prozent: " +
        (summe * 100).toLocaleString("de-DE", {
            maximumFractionDigits: 6
        }) + " %";

meldung.textContent =
    "Die Wahrscheinlichkeit für höchstens " + k +
    " Treffer bei " + n + " Versuchen beträgt " +
    (summe * 100).toLocaleString("de-DE", {
        maximumFractionDigits: 4
    }) + " %. ";

if (summe > 0) {
    meldung.textContent +=
        "Das entspricht einem Verhältnis von 1 zu " +
        (1 / summe).toLocaleString("de-DE", {
            maximumFractionDigits: 2
        }) + ".";
} else {
    meldung.textContent +=
        "Ein entsprechendes Verhältnis lässt sich nicht angeben, " +
        "da die Wahrscheinlichkeit 0 beträgt.";
}

meldung.className = "";
}

function fehler(text) {
    document.getElementById("wert").textContent = "Eingabefehler";
    document.getElementById("prozent").textContent = "";
    document.getElementById("meldung").textContent = text;
    document.getElementById("meldung").className = "fehler";
}
</script>
</body>
</html>
